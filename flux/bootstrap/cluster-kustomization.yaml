apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/runtime
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: shared-values
      - kind: ConfigMap
        name: runtime-values
