apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: default
spec:
  chart:
    spec:
      interval: 1m
      chart: gitlab
      version: 9.10.3
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      targetNamespace: gitlab
      install:
        createNamespace: true