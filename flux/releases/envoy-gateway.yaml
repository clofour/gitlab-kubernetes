apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: cert-manager
    - name: dns01-certificate
  chart:
    spec:
      chartRef:
        kind: OCIRepository
        name: envoy-proxy
        namespace: flux-system
  targetNamespace: envoy-gateway-system
  install:
    createNamespace: true
