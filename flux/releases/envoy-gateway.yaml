apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  chart:
    spec:
      interval: 1m
      chartRef:
        kind: OCIRepository
        name: envoy-proxy
        namespace: flux-system
      targetNamespace: envoy-gateway-system
      install:
        createNamespace: true
