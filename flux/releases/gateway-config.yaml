apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-config
  namespace: flux-system
spec:
  chart:
    spec:
      interval: 1m
      dependsOn:
        - envoy-gateway
      chart: ./helm/gateway-config
      sourceRef:
        kind: GitRepository
        name: github
        namespace: flux-system
      targetNamespace: envoy-gateway-system
      install:
        createNamespace: true
      values:
        name: gateway
        certificateName: wildcard-certificate
