apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dns01-certificate
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: cert-manager
    - name: cluster-issuer
  chart:
    spec:
      chart: ./helm/dns01-certificate/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  targetNamespace: cert-manager
  install:
    createNamespace: true
  values:
    name: wildcard-certificate
    secretName: wildcard-certificate
    issuer: letsencrypt
