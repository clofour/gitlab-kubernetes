apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  chart:
    spec:
      interval: 1m
      dependsOn:
        - reflector
      chart: external-dns
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      targetNamespace: external-dns
      install:
        createNamespace: true
      values:
        provider:
          name: digitalocean
        env:
          - name: DO_TOKEN
            valueFrom:
              secretKeyRef:
                name: do-dns-secret
                key: password
        domainFilters:
          - ${domain}
        txtOwnerId: ${cluster_name}
        sources:
          - service
          - gateway-httproute
        policy: sync
