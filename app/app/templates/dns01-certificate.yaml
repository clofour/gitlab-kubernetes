apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns01-certificate
  namespace: argocd
spec:
  project: default
  source:
    chart: ./../helm/dns01-certificate/chart

    helm:
      valuesObject:
        domain: {{ .Values.domain }}
        dnsNameTemplates: {{ .Values.dnsNameTemplates }}

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
