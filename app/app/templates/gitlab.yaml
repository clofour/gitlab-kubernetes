apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.gitlab.io
      chart: gitlab
      targetRevision: 9.10.3

      helm:
        valueFiles:
          - $values/helm/gitlab/values.yaml

    - repoURL: {{ .Values.repoURL }}
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
